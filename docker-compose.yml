services:

  ranking:
    image: anthropic:latest
    container_name: ampyfin-rank
    command: ["ranking_client.py"]
    restart: unless-stopped
    profiles:
      - rank
    env_file:
      - .env

  trading:
    image: anthropic:latest
    container_name: ampyfin-trade
    command: ["trading_client.py"]
    restart: unless-stopped
    profiles:
      - trade
    env_file:
      - .env

  training:
    image: anthropic:latest
    container_name: ampyfin-train
    command: ["training_client.py"]
    volumes:
      - training:/training-data
    profiles:
      - train
    env_file:
      - .env

  setup:
    image: anthropic:latest
    container_name: ampyfin-setup
    command: ["setup.py"]
    profiles:
      - setup
    env_file:
      - .env

  scores:
    image: anthropic:latest
    container_name: ampyfin-scores
    command: ["utils/check_strategy_scores.py"]
    profiles:
      - scores
    env_file:
      - .env

  interactive:
    image: anthropic:latest
    container_name: ampyfin-int
    entrypoint: ["/bin/sh"]
    stdin_open: true
    tty: true
    volumes:
      - training:/training-data
    profiles:
      - interactive
    env_file:
      - .env

  mongo:
    image: mongo:latest
    container_name: ampyfin-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    profiles:
      - mongo
    attach: false
  
volumes:
  mongo_data:
  training:
